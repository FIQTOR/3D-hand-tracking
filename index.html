<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Tracking - 4-Finger Cultivation Cube & 2D Mask</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }

        /* Video Setup */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        /* Canvas 3D Overlay */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ededed;
            font-size: 18px;
            font-weight: 500;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* Vercel UI Panel */
        #controls {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 260px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="color"] {
            width: 100%;
            background: #111;
            color: #ededed;
            border: 1px solid #333;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
            cursor: pointer;
        }

        select:hover,
        input[type="color"]:hover {
            border-color: #555;
        }

        select:focus,
        input[type="color"]:focus {
            border-color: #ededed;
        }

        input[type="color"] {
            padding: 2px 4px;
            height: 40px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div id="loading">Initialize Camera & AI...</div>

    <div id="controls">
        <div class="control-group">
            <label>Camera Source</label>
            <select id="cameraSelect"></select>
        </div>

        <div class="control-group">
            <label>Filter Type</label>
            <select id="filterSelect">
                <option value="0">Grayscale</option>
                <option value="1" selected>Invert (Negative)</option>
                <option value="2">Sepia</option>
                <option value="3">Normal (No Filter)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Edge Color</label>
            <input type="color" id="colorSelect" value="#00ffff">
        </div>
    </div>

    <video id="webcam" autoplay playsinline></video>

    <script>
        const videoElement = document.getElementById('webcam');
        const cameraSelect = document.getElementById('cameraSelect');
        const filterSelect = document.getElementById('filterSelect');
        const colorSelect = document.getElementById('colorSelect');
        const loadingText = document.getElementById('loading');

        let currentStream = null;
        let isProcessing = false;
        let animationFrameId = null;

        // STATE PENJAGAAN DEBOUNCE (TIDAK FLICKERING)
        let activeMode3D = false;
        let mode3DCounter = 0;
        let mode2DCounter = 0;

        // ==========================================
        // 1. SETUP THREE.JS
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // ==========================================
        // 2. SHADER & GEOMETRY SETUP
        // ==========================================
        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;

        const filterMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tVideo: { value: videoTexture },
                uMirror: { value: true },
                uFilterType: { value: 1 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uVideoResolution: { value: new THREE.Vector2(1280, 720) }
            },
            vertexShader: `
                varying vec4 vScreenPos;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    vScreenPos = gl_Position;
                }
            `,
            fragmentShader: `
                uniform sampler2D tVideo;
                uniform bool uMirror;
                uniform int uFilterType;
                uniform vec2 uResolution;
                uniform vec2 uVideoResolution;
                varying vec4 vScreenPos;
                
                void main() {
                    vec2 uv = (vScreenPos.xy / vScreenPos.w) * 0.5 + 0.5;
                    
                    float screenAspect = uResolution.x / uResolution.y;
                    float videoAspect = uVideoResolution.x / uVideoResolution.y;
                    
                    vec2 scale = vec2(1.0);
                    if (screenAspect > videoAspect) {
                        scale.y = videoAspect / screenAspect;
                    } else {
                        scale.x = screenAspect / videoAspect;
                    }
                    
                    uv = (uv - 0.5) * scale + 0.5;
                    
                    if (uMirror) {
                        uv.x = 1.0 - uv.x;
                    }

                    vec4 color = texture2D(tVideo, uv);
                    
                    if (uFilterType == 0) {
                        float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                        gl_FragColor = vec4(vec3(gray), 1.0);
                    } else if (uFilterType == 1) {
                        gl_FragColor = vec4(1.0 - color.rgb, 1.0);
                    } else if (uFilterType == 2) {
                        float r = dot(color.rgb, vec3(0.393, 0.769, 0.189));
                        float g = dot(color.rgb, vec3(0.349, 0.686, 0.168));
                        float b = dot(color.rgb, vec3(0.272, 0.534, 0.131));
                        gl_FragColor = vec4(r, g, b, 1.0);
                    } else {
                        gl_FragColor = color;
                    }
                }
            `,
            side: THREE.DoubleSide
        });

        const filterGeometry = new THREE.BufferGeometry();
        const filterVertices = new Float32Array(6 * 3);
        filterGeometry.setAttribute('position', new THREE.BufferAttribute(filterVertices, 3));

        const filterMesh = new THREE.Mesh(filterGeometry, filterMaterial);
        filterMesh.visible = false;
        scene.add(filterMesh);

        const edgeGeometry = new THREE.BufferGeometry();
        const edgeVertices = new Float32Array(60 * 3);
        edgeGeometry.setAttribute('position', new THREE.BufferAttribute(edgeVertices, 3));

        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
        const edgeLines = new THREE.LineSegments(edgeGeometry, edgeMaterial);
        edgeLines.visible = false;
        scene.add(edgeLines);

        // 3D CUBE SETUP
        const boxBaseGeometry = new THREE.BoxGeometry(1, 1, 1);
        const boxMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.55,
            roughness: 0.1,
            metalness: 0.8,
            side: THREE.DoubleSide
        });

        const boxEdgesGeometry = new THREE.EdgesGeometry(boxBaseGeometry);
        const boxEdgeMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });

        const boxMeshGroup = new THREE.Group();
        boxMeshGroup.add(new THREE.Mesh(boxBaseGeometry, boxMaterial));
        boxMeshGroup.add(new THREE.LineSegments(boxEdgesGeometry, boxEdgeMaterial));
        boxMeshGroup.visible = false;
        scene.add(boxMeshGroup);

        filterSelect.addEventListener('change', (e) => {
            filterMaterial.uniforms.uFilterType.value = parseInt(e.target.value);
        });

        colorSelect.addEventListener('input', (e) => {
            edgeMaterial.color.set(e.target.value);
            boxMaterial.color.set(e.target.value);
            boxEdgeMaterial.color.set(e.target.value);
        });

        function get3DPosition(x, y, z) {
            const isFrontCamera = videoElement.style.transform !== 'none';

            const windowAspect = window.innerWidth / window.innerHeight;
            const videoAspect = (videoElement.videoWidth && videoElement.videoHeight)
                ? (videoElement.videoWidth / videoElement.videoHeight)
                : (1280 / 720);

            let scaleX = 1;
            let scaleY = 1;

            if (windowAspect > videoAspect) {
                scaleY = windowAspect / videoAspect;
            } else {
                scaleX = videoAspect / windowAspect;
            }

            let normX = isFrontCamera ? (1.0 - x) : x;
            let normY = y;

            normX = (normX - 0.5) * scaleX + 0.5;
            normY = (normY - 0.5) * scaleY + 0.5;

            const ndcX = (normX - 0.5) * 2;
            const ndcY = -(normY - 0.5) * 2;

            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * camera.position.z;
            const visibleWidth = visibleHeight * camera.aspect;

            const posX = (ndcX * visibleWidth) / 2;
            const posY = (ndcY * visibleHeight) / 2;
            const posZ = -z * 5;

            return new THREE.Vector3(posX, posY, posZ);
        }

        function checkLineIntersection2D(a, b, c, d) {
            const det = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
            if (Math.abs(det) < 0.0001) return null;

            const lambda = ((d.y - c.y) * (d.x - a.x) + (c.x - d.x) * (d.y - a.y)) / det;
            const gamma = ((a.y - b.y) * (d.x - a.x) + (b.x - a.x) * (d.y - a.y)) / det;

            if ((0 <= lambda && lambda <= 1) && (0 <= gamma && gamma <= 1)) {
                return new THREE.Vector3(
                    a.x + lambda * (b.x - a.x),
                    a.y + lambda * (b.y - a.y),
                    (a.z + b.z + c.z + d.z) / 4
                );
            }
            return null;
        }

        // DETEKSI JUMLAH JARI PRESISI
        function countOpenFingers(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            let count = 0;

            for (let i = 0; i < 4; i++) {
                if (landmarks[tips[i]].y < landmarks[pips[i]].y - 0.02) count++;
            }

            const thumbTip = landmarks[4];
            const thumbIp = landmarks[3];
            if (Math.abs(thumbTip.x - landmarks[0].x) > Math.abs(thumbIp.x - landmarks[0].x) + 0.02) count++;

            return count;
        }

        // ==========================================
        // 3. MEDIAPIPE TRACKING
        // ==========================================
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            loadingText.style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                let h1 = results.multiHandLandmarks[0];
                let h2 = results.multiHandLandmarks[1];

                if (h1[0].x > h2[0].x) {
                    [h1, h2] = [h2, h1];
                }

                const fingers1 = countOpenFingers(h1);
                const fingers2 = countOpenFingers(h2);

                // --- SYARAT KUBUS 3D: MINIMAL 4 JARI TERANGKAT DI SALAH SATU TANGAN ---
                const rawWant3D = (fingers1 >= 4 || fingers2 >= 4);

                if (rawWant3D) {
                    mode3DCounter++;
                    mode2DCounter = 0;
                } else {
                    mode2DCounter++;
                    mode3DCounter = 0;
                }

                if (mode3DCounter >= 3) {
                    activeMode3D = true;
                } else if (mode2DCounter >= 3) {
                    activeMode3D = false;
                }

                // RENDERING MODE 3D KULTIVASI
                if (activeMode3D) {
                    filterMesh.visible = false;
                    boxMeshGroup.visible = true;
                    edgeLines.visible = true;

                    const wrist1 = get3DPosition(h1[0].x, h1[0].y, h1[0].z);
                    const wrist2 = get3DPosition(h2[0].x, h2[0].y, h2[0].z);

                    const boxCenter = wrist1.clone().add(wrist2).multiplyScalar(0.5);
                    boxMeshGroup.position.copy(boxCenter);

                    const handDistance = wrist1.distanceTo(wrist2);
                    const cubeScale = Math.max(0.5, handDistance * 0.45);
                    boxMeshGroup.scale.set(cubeScale, cubeScale, cubeScale);

                    boxMeshGroup.rotation.x += 0.02;
                    boxMeshGroup.rotation.y += 0.025;

                    // Garis Aura Kultivasi
                    const linePts = [];
                    const fingerTipIndices = [4, 8, 12, 16, 20];

                    fingerTipIndices.forEach(idx => {
                        let pt1 = get3DPosition(h1[idx].x, h1[idx].y, h1[idx].z);
                        let pt2 = get3DPosition(h2[idx].x, h2[idx].y, h2[idx].z);

                        linePts.push(pt1.x, pt1.y, pt1.z, boxCenter.x, boxCenter.y, boxCenter.z);
                        linePts.push(pt2.x, pt2.y, pt2.z, boxCenter.x, boxCenter.y, boxCenter.z);
                    });

                    const edgePosAttr = edgeGeometry.attributes.position;
                    for (let i = 0; i < linePts.length; i++) {
                        edgePosAttr.array[i] = linePts[i];
                    }
                    edgeGeometry.setDrawRange(0, linePts.length / 3);
                    edgePosAttr.needsUpdate = true;

                } else {
                    // RENDERING MODE 2D (TELUNJUK & JEMPOL / PITA X)
                    filterMesh.visible = true;
                    edgeLines.visible = true;
                    boxMeshGroup.visible = false;

                    let t1 = get3DPosition(h1[8].x, h1[8].y, h1[8].z);
                    let j1 = get3DPosition(h1[4].x, h1[4].y, h1[4].z);
                    let t2 = get3DPosition(h2[8].x, h2[8].y, h2[8].z);
                    let j2 = get3DPosition(h2[4].x, h2[4].y, h2[4].z);

                    const crossPt = checkLineIntersection2D(t1, t2, j1, j2);
                    const filterPosAttr = filterGeometry.attributes.position;
                    const linePts = [];

                    if (crossPt) {
                        // BENTUK PITA SILANG |><|
                        filterPosAttr.setXYZ(0, t1.x, t1.y, t1.z);
                        filterPosAttr.setXYZ(1, j1.x, j1.y, j1.z);
                        filterPosAttr.setXYZ(2, crossPt.x, crossPt.y, crossPt.z);

                        filterPosAttr.setXYZ(3, t2.x, t2.y, t2.z);
                        filterPosAttr.setXYZ(4, j2.x, j2.y, j2.z);
                        filterPosAttr.setXYZ(5, crossPt.x, crossPt.y, crossPt.z);

                        filterGeometry.setDrawRange(0, 6);

                        linePts.push(
                            t1.x, t1.y, t1.z, t2.x, t2.y, t2.z,
                            j1.x, j1.y, j1.z, j2.x, j2.y, j2.z,
                            t1.x, t1.y, t1.z, j1.x, j1.y, j1.z,
                            t2.x, t2.y, t2.z, j2.x, j2.y, j2.z
                        );

                    } else {
                        // BENTUK PERSEGI / QUAD NORMAL
                        filterPosAttr.setXYZ(0, t1.x, t1.y, t1.z);
                        filterPosAttr.setXYZ(1, t2.x, t2.y, t2.z);
                        filterPosAttr.setXYZ(2, j2.x, j2.y, j2.z);

                        filterPosAttr.setXYZ(3, t1.x, t1.y, t1.z);
                        filterPosAttr.setXYZ(4, j2.x, j2.y, j2.z);
                        filterPosAttr.setXYZ(5, j1.x, j1.y, j1.z);

                        filterGeometry.setDrawRange(0, 6);

                        linePts.push(
                            t1.x, t1.y, t1.z, t2.x, t2.y, t2.z,
                            t2.x, t2.y, t2.z, j2.x, j2.y, j2.z,
                            j2.x, j2.y, j2.z, j1.x, j1.y, j1.z,
                            j1.x, j1.y, j1.z, t1.x, t1.y, t1.z
                        );
                    }

                    filterPosAttr.needsUpdate = true;

                    const edgePosAttr = edgeGeometry.attributes.position;
                    for (let i = 0; i < linePts.length; i++) {
                        edgePosAttr.array[i] = linePts[i];
                    }
                    edgeGeometry.setDrawRange(0, linePts.length / 3);
                    edgePosAttr.needsUpdate = true;
                }

            } else {
                filterMesh.visible = false;
                edgeLines.visible = false;
                boxMeshGroup.visible = false;
            }
        });

        // ==========================================
        // 4. CAMERA SWITCH LOGIC
        // ==========================================
        async function processVideoFrame() {
            if (videoElement.currentTime > 0 && !videoElement.paused && !videoElement.ended && videoElement.readyState >= 2) {
                if (!isProcessing) {
                    isProcessing = true;
                    await hands.send({ image: videoElement });
                    renderer.render(scene, camera);
                    isProcessing = false;
                }
            }
            animationFrameId = requestAnimationFrame(processVideoFrame);
        }

        async function getCameras() {
            await navigator.mediaDevices.getUserMedia({ video: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');

            cameraSelect.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Camera ${index + 1}`;
                cameraSelect.appendChild(option);
            });

            if (videoDevices.length > 0) {
                startCamera(videoDevices[0].deviceId);
            }
        }

        async function startCamera(deviceId) {
            loadingText.style.display = 'block';

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: { exact: deviceId },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                videoElement.srcObject = currentStream;

                videoElement.onloadedmetadata = () => {
                    videoElement.play();

                    const track = currentStream.getVideoTracks()[0];
                    const settings = track.getSettings();

                    const isFrontCamera = !(settings.facingMode === 'environment' || cameraSelect.selectedOptions[0].text.toLowerCase().includes('back'));

                    videoElement.style.transform = isFrontCamera ? 'scaleX(-1)' : 'none';

                    filterMaterial.uniforms.uMirror.value = isFrontCamera;
                    filterMaterial.uniforms.uVideoResolution.value.set(
                        videoElement.videoWidth || 1280,
                        videoElement.videoHeight || 720
                    );

                    processVideoFrame();
                };
            } catch (err) {
                console.error("Gagal mengganti kamera:", err);
                loadingText.innerText = "Gagal memuat kamera!";
            }
        }

        cameraSelect.addEventListener('change', (e) => startCamera(e.target.value));
        getCameras();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            filterMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
